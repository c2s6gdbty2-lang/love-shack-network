# Example Samba share for GUI-SAFE tests (The Love Shack Network). Addresses are fictive (192.168.1.x).
# Directory layout on the server (owner, mode):
#   /srv/GuiSafeTest                root 755
#   /srv/GuiSafeTest/Programs/...   root 755/644  (original program files, read-only for gstest)
#   /srv/GuiSafeTest/Tests          root 755
#   /srv/GuiSafeTest/Tests/A600     gstest 750    (the only writable folder)
# gstest: system user without login shell and home; also add "invalid users = gstest" to [printers] and [print$].
[GuiSafeTest]
   comment = GUI-SAFE isolated test share
   path = /srv/GuiSafeTest
   browseable = no
   read only = no
   guest ok = no
   valid users = gstest
   force user = gstest
   force group = gstest
   create mask = 0640
   directory mask = 0750
   hosts allow = 192.168.1.60 127.0.0.1
   follow symlinks = no
   wide links = no
