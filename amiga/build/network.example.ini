# Network details for build_public.py. Copy this file, fill in your own values,
# and keep your copy out of version control (network.ini is listed in .gitignore).
#
# host: the IPv4 address of your IPP printer. Do not use leading zeros
#       (AmiTCP reads "050" as octal). Give the printer a DHCP reservation so
#       the address does not change. AmiTCP 3.0b2 has no mDNS, so names such
#       as "printer.local" do not work unless they are in AmiTCP:db/hosts.
# port: usually 631.
# path: usually /ipp/print. Check with the printer's web page, or run
#       ControleerPrinter with HOST=... after installation.
# name: only shown in comments and the LeesMij file.

[printer]
name = printer
host = 192.168.1.50
port = 631
path = /ipp/print
